name: Flutter SATE Extension CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r SATE/flutter_bridge/requirements.txt
    - name: Verify Python bridge script syntax
      run: |
        python -m py_compile SATE/flutter_bridge/bridge.py
